service:
  name: service-and-pipeline-gitx-branching-test-service
  identifier: serviceandpipelinegitxbranchingtestservice
  orgIdentifier: default
  projectIdentifier: technical_exercise
  tags:
    "32": ""
  serviceDefinition:
    spec:
      manifests:
        - manifest:
            identifier: manifest
            type: K8sManifest
            spec:
              store:
                type: Github
                spec:
                  connectorRef: account.ghconnectoracc
                  gitFetchType: Branch
                  paths:
                    - kubernetes/manifests/alpine
                  repoName: harness-yaml-templates
                  branch: main
              skipResourceVersioning: false
              enableDeclarativeRollback: false
      artifacts:
        primary:
          primaryArtifactRef: <+input>
          sources:
            - spec:
                connectorRef: account.lorenharnessdockerhub
                imagePath: library/nginx
                tag: <+input>
                digest: ""
              identifier: dockerhub
              type: DockerRegistry
    type: Kubernetes
